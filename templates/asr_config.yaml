# ASR Training Configuration Template
model_name: openai/whisper-small
dataset_path: your-dataset-name-or-path
output_dir: whisper-finetuned
audio_column: audio
text_column: text

# Audio processing parameters
sampling_rate: 16000
max_duration_secs: 30.0
preprocessing_num_workers: 4

# Model parameters
language: en
task: transcribe

# Training parameters
learning_rate: 5e-5
num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1
eval_steps: 100
save_steps: 500
logging_steps: 10
warmup_steps: 0
max_steps: null  # Set to a number to override num_train_epochs

# PEFT/LoRA parameters
use_peft: true
lora_r: 8
lora_alpha: 32
lora_dropout: 0.1
target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Mixed precision and logging
mixed_precision: fp16
log: tensorboard 